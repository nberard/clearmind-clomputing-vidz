name: vibegen_grid
version: "1.0.0"
config-version: 2
profile: vibegen_grid

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # share of each stage skipped before measuring throughput (jobs started in
  # the previous stage are still finishing)
  stage_warmup_share: 0.3

models:
  vibegen_grid:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
