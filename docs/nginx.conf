# For a server that already runs nginx on ports 80/443.
# 1. Copy to /etc/nginx/sites-available/grid and replace grid.example.com
# 2. sudo ln -s /etc/nginx/sites-available/grid /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS: sudo certbot --nginx -d grid.example.com
#    (phones need HTTPS to keep the screen awake while working)
server {
    listen 80;
    server_name grid.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
